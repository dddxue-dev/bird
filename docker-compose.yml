# ===============================================================
#  本地测试用 docker-compose
#  用法：
#     docker compose up --build
#     浏览器打开 http://localhost:8080
#
#  注意：CTFd Whale 动态 Flag 部署时不需要这个文件，
#        直接用平台把镜像跑起来、注入 FLAG 环境变量即可。
# ===============================================================
services:
  wings:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wings-for-life:latest
    container_name: wings-for-life
    ports:
      - "8080:80"
    environment:
      # 这就是动态 Flag 的注入点，平台会覆盖它。
      # 本地测试想看到和 PHPStudy 一样的占位值，就保持 flag{12345678}。
      FLAG: "flag{12345678}"
      DB_NAME: wings
      DB_USER: wings
      DB_PASS: wingspass
    restart: unless-stopped
