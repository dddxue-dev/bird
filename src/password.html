<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 · 羽翼同行</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">W</span>
      <span class="brand-text">
        <strong>羽翼同行</strong>
        <em>Wings for Life</em>
      </span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="index.html#birds">鸟类图鉴</a>
      <a href="guangxi.html">观鸟在广西</a>
      <a href="about.html">保护理念</a>
    </nav>
    <div class="account" id="account-area">
      <a class="btn btn-ghost" href="login.html">登录</a>
      <a class="btn btn-solid" href="register.html">注册</a>
    </div>
  </div>
</header>

<main>

  <section class="page-hero">
    <div class="wrap">
      <h1>修改密码</h1>
      <p>账号：<span id="ph-username">加载中…</span></p>
    </div>
  </section>

  <div class="wrap auth-wrap">
    <div class="card-panel">

      <h2>设置新密码</h2>
      <p class="sub">修改成功后当前登录状态会失效，需要用新密码重新登录。</p>

      <div class="alert alert-err" id="form-alert" style="display:none"></div>

      <form id="passchange-form" autocomplete="off">
        <div class="field">
          <label for="current_password">当前密码</label>
          <input name="current_password" id="current_password" type="password" required>
        </div>

        <div class="field">
          <label for="password">新密码</label>
          <input name="password" id="password" type="password" required>
          <p class="hint">建议使用字母、数字与符号的组合。</p>
        </div>

        <div class="field">
          <label for="re_password">确认新密码</label>
          <input name="re_password" id="re_password" type="password" required>
        </div>

        <button class="btn btn-solid btn-block" type="submit">保存修改</button>
      </form>

      <p class="form-foot"><a href="profile.html">返回用户中心</a></p>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="foot-brand">
      <strong>羽翼同行 · Wings for Life</strong>
      <p>人或许长不出翅膀，但人可以选择是否同行。</p>
    </div>
    <div class="foot-meta">
      <p>本站为鸟类保护公益宣传站，由志愿者团队自发维护。</p>
      <p class="muted">图鉴照片来自 iNaturalist 公开观察记录（CC 授权）。</p>
    </div>
  </div>
</footer>

<div id="toast-host"></div>
<script src="assets/app.js"></script>
<script src="assets/password.js"></script>
</body>
</html>
